# https://lefthook.dev/configuration/index.html
pre-commit:
  jobs:
    - run: cargo fmt
      stage_fixed: true
      glob:
        - "*.rs"
    - run: cargo clippy --all-targets -- --deny warnings --allow unused
      glob:
        - "*.rs"
    - run: scripts/test --quiet
      glob:
        - "src/*"
        - "Cargo.toml"
commit-msg:
  jobs:
    - run: scripts/check-git-message-format {1}
pre-push:
  jobs:
    - run: scripts/check-no-temporary-commits
      use_stdin: true
