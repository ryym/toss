# https://lefthook.dev/configuration/index.html
pre-commit:
  jobs:
    - run: cargo fmt
      stage_fixed: true
      glob:
        - "*.rs"
    - run: cargo clippy -- --deny warnings --allow unused
      glob:
        - "*.rs"
    - run: cargo test --quiet
      glob:
        - "src/*"
        - "Cargo.toml"
commit-msg:
  jobs:
    - run: scripts/check-git-message-format {1}
