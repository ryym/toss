services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - target:/app/target
    deploy:
      resources:
        limits:
          cpus: ${CONTAINER_CPUS:-0.3}
          memory: ${CONTAINER_MEM:-216m}
volumes:
  cargo-registry:
  target:
